[build-system]
requires = ["scikit-build-core >=0.10", "nanobind >=1.3.2"]
build-backend = "scikit_build_core.build"

[project]
name = "forte2"
version = "2026.9.1"
description = "An open-source suite of quantum chemistry methods for strongly correlated electrons"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "FAE", email = "f.e@emory.edu" },
]
classifiers = [
    "License :: OSI Approved :: BSD License",
]
dependencies = [
    "scikit_build_core",
]

[project.urls]
Homepage = "https://github.com/evangelistalab/forte2"

[tool.scikit-build]
# Protect the configuration against future changes in scikit-build-core
minimum-version = "build-system.requires"

# Setuptools-style build caching in a local directory
build-dir = "build/{wheel_tag}"

# Build stable ABI wheels for CPython 3.12+
wheel.py-api = "cp312"

# The build type to use when building the project. Valid values are "Debug", "Release", "MinSizeRel", and "RelWithDebInfo".
cmake.build-type = "Release"
# Extra CMake arguments to pass to the build system
#cmake.args = [
#    "-DCMAKE_CXX_FLAGS='-fsanitize=address -fno-omit-frame-pointer'"
#]

# Default CMake options (can be overridden via --config-settings or CMAKE_ARGS)
[tool.scikit-build.cmake.define]
# Toggle libcint integration (two-center integrals via libcint). Override with:
#   pip install . --config-settings=cmake.define.USE_LIBCINT=ON
# or: CMAKE_ARGS="-DUSE_LIBCINT=ON" pip install .
USE_LIBCINT = "ON"

# Pytest configuration
[tool.pytest.ini_options]
minversion = "6.0"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
testpaths = [
    "tests",
]
python_functions = [
    "test_*",
]
