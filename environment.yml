name: forte2

channels:
  - conda-forge
  - nodefaults

dependencies:
    - python=3.12
    - pip
    - nanobind>=1.3.2
    # build-time header dependency of block2 (USE_BLOCK2=ON); block2 0.5.3 predates pybind11 3.x
    - pybind11<3
    - cxx-compiler
    - ccache
    - openblas
    - libblas=*=*openblas
    - cmake=3.26
    - numpy
    - scipy
    - eigen=3.4.0
    - boost
    - scikit-build-core>=0.10
    - pytest
    - pytest-cov
    - nbmake
    - conda-forge::libint
    - conda-forge::regex
    - conda-forge::basis_set_exchange
