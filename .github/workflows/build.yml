name: build

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  schedule:
    - cron: '30 15 * * *'
  merge_group:
    types: [checks_requested]

# Cancel in-progress runs when a newer commit is pushed to the same PR/branch.
# Never cancel on main or in merge queue, where every run must complete.
concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      actions: write      # needed to delete stale caches
      contents: read
    env:
      # Cache .o files
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: "1G"
      CCACHE_COMPILERCHECK: content
      # Rewrite absolute paths under the workspace to relative before hashing,
      # so cache entries aren't tied to the checkout's absolute location.
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_SLOPPINESS: include_file_ctime,include_file_mtime,time_macros,locale,pch_defines
    defaults:
      run:
        shell: bash -el {0}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04, macos-latest, ubuntu-24.04-arm, ubuntu-22.04-arm]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'true'

    - name: Setup Conda
      uses: conda-incubator/setup-miniconda@v3
      with:
        activate-environment: forte
        environment-file: environment.yml
        channels: conda-forge
        show-channel-urls: true
        python-version: '3.12'
        auto-activate-base: false
        add-pip-as-python-dependency: true

    - name: Restore C++ build tree
      id: cache-restore
      uses: actions/cache/restore@v4
      with:
        path: build
        key: cxxbuild-${{ matrix.os }}-${{ hashFiles('environment.yml', '**/CMakeLists.txt', 'pyproject.toml') }}-${{ github.run_id }}
        restore-keys: |
          cxxbuild-${{ matrix.os }}-${{ hashFiles('environment.yml', '**/CMakeLists.txt', 'pyproject.toml') }}-

    - name: Restore ccache
      id: ccache-restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ matrix.os }}-${{ github.run_id }}
        restore-keys: |
          ccache-${{ matrix.os }}-

    - name: Compile Forte2
      id: compile-forte2
      run: |
        conda activate forte
        export CMAKE_GENERATOR="Unix Makefiles"
        ccache --zero-stats
        pip install --no-build-isolation -ve . \
          --config-settings=cmake.define.CMAKE_C_COMPILER_LAUNCHER=ccache \
          --config-settings=cmake.define.CMAKE_CXX_COMPILER_LAUNCHER=ccache
        ccache --show-stats
        pip list

    - name: Save C++ build tree
      if: ${{ steps.compile-forte2.outcome == 'success' && !cancelled() }}
      uses: actions/cache/save@v4
      with:
        path: build
        key: cxxbuild-${{ matrix.os }}-${{ hashFiles('environment.yml', '**/CMakeLists.txt', 'pyproject.toml') }}-${{ github.run_id }}

    - name: Save ccache
      if: ${{ steps.compile-forte2.outcome == 'success' && !cancelled() }}
      uses: actions/cache/save@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ matrix.os }}-${{ github.run_id }}

    # Keep only the most recent generation of this job's caches for this ref
    - name: Prune stale caches for this ref
      if: ${{ steps.compile-forte2.outcome == 'success' && !cancelled() }}
      env:
        GH_TOKEN: ${{ github.token }}
        OS: ${{ matrix.os }}
      run: |
        # The caches are named
        # "ccache-<os>-<runid>" and "cxxbuild-<os>-<64hexhash>-<runid>"
        for pat in \
          "^ccache-${OS}-[0-9]+\$" \
          "^cxxbuild-${OS}-[0-9a-f]+-[0-9]+\$"; do
          # Newest first; keep index 0 (the generation we just saved), delete the rest.
          ids=$(gh cache list --ref "$GITHUB_REF" \
                  --sort created_at --order desc --limit 100 \
                  --json id,key --repo "$GITHUB_REPOSITORY" \
                  --jq "[.[] | select(.key | test(\"$pat\"))][1:][].id" 2>/dev/null) || ids=""
          for id in $ids; do
            echo "Deleting stale cache $id"
            gh cache delete "$id" --repo "$GITHUB_REPOSITORY" || true
          done
        done

    - name: Run Forte2 pytest tests
      if: ${{ steps.compile-forte2.outcome == 'success' && !cancelled() }}
      run: |
        conda activate forte
        cd $HOME/work/forte2/forte2/tests
        if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "merge_group" || ( "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.draft }}" == "false" ) ]]; then
          pytest -v -n auto --cov --cov-branch --cov-report=xml
        else
          pytest -v -n auto -m "not slow" --cov --cov-branch --cov-report=xml
        fi

    - name: Run Forte2 notebook tests
      if: ${{ steps.compile-forte2.outcome == 'success' && !cancelled() }}
      run: |
        conda activate forte
        cd $HOME/work/forte2/forte2/tutorials
        pytest -v -n auto --nbmake *.ipynb

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}